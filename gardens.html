<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gardens — Tractform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',system-ui,sans-serif}.stat-fill{height:100%;border-radius:9999px;transition:width .4s ease}.media-ph{width:100%;aspect-ratio:16/10;border-radius:.75rem;background:#064e3b;border:1px dashed #065f46;display:flex;align-items:center;justify-content:center;color:#6ee7b7;font-size:.75rem}</style>
</head>
<body class="bg-stone-100 text-stone-900 antialiased">
  <header class="bg-emerald-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between gap-4">
      <a href="/" class="flex items-center gap-2 shrink-0"><div class="w-7 h-7 rounded-md bg-white/15 flex items-center justify-center"><span class="font-bold text-sm">T</span></div><span class="font-semibold tracking-tight">Tractform</span></a>
      <nav class="hidden sm:flex gap-5 text-sm font-medium text-emerald-100/90">
        <a href="/land.html" class="hover:text-white">Land</a>
        <a href="/utilities.html" class="hover:text-white">Utilities</a>
        <a href="/buildings.html" class="hover:text-white">Buildings</a>
        <a href="/production.html" class="hover:text-white">Livestock</a>
        <a href="/gardens.html" class="text-white font-semibold">Gardens</a>
        <a href="/family.html" class="hover:text-white">Household</a>
      </nav>
    </div>
  </header>
  <section class="max-w-6xl mx-auto px-6 pt-8 pb-3"><h1 class="text-2xl font-bold tracking-tight">Gardens</h1></section>
  <section class="max-w-6xl mx-auto px-6 pb-16">
    <div class="grid lg:grid-cols-3 gap-6 items-start">
      <div class="lg:col-span-2 space-y-4">
        <div class="bg-white border border-stone-200 rounded-2xl p-5">
          <label class="block text-sm font-semibold mb-3">Focus</label>
          <div class="flex flex-wrap gap-2">
            <button type="button" data-g="kitchen" class="g-btn px-4 py-2 rounded-lg border border-emerald-800 bg-emerald-800 text-white text-sm font-medium">Kitchen garden</button>
            <button type="button" data-g="calorie" class="g-btn px-4 py-2 rounded-lg border border-stone-300 bg-white text-stone-700 text-sm font-medium">Calorie crops</button>
            <button type="button" data-g="orchard" class="g-btn px-4 py-2 rounded-lg border border-stone-300 bg-white text-stone-700 text-sm font-medium">Orchard</button>
            <button type="button" data-g="market" class="g-btn px-4 py-2 rounded-lg border border-stone-300 bg-white text-stone-700 text-sm font-medium">Market garden</button>
          </div>
        </div>
        <div class="bg-white border border-stone-200 rounded-2xl p-5 grid sm:grid-cols-2 gap-4">
          <div><label class="block text-sm font-semibold mb-2">Area (sq ft)</label><input id="area" type="number" min="50" max="200000" value="800" class="w-full rounded-lg border border-stone-300 px-3 py-2.5 text-sm" /></div>
          <div><label class="block text-sm font-semibold mb-2">Water method</label><select id="water" class="w-full rounded-lg border border-stone-300 px-3 py-2.5 text-sm"><option value="hand">Hand / hose</option><option value="drip" selected>Drip</option><option value="overhead">Overhead</option></select></div>
        </div>
        <div class="bg-emerald-900 text-white rounded-2xl p-5">
          <h3 class="text-xs font-medium text-emerald-200 uppercase tracking-wide mb-3">Season</h3>
          <div class="grid grid-cols-3 gap-3 text-sm">
            <div><p class="text-emerald-200/80 text-xs">Frost-free days</p><p id="t-days" class="font-semibold">—</p></div>
            <div><p class="text-emerald-200/80 text-xs">Peak labor</p><p id="t-labor" class="font-semibold">—</p></div>
            <div><p class="text-emerald-200/80 text-xs">Water</p><p id="t-h2o" class="font-semibold">—</p></div>
          </div>
        </div>
      </div>
      <div class="lg:col-span-1">
        <div class="lg:sticky lg:top-20 rounded-2xl bg-emerald-950 text-emerald-50 p-5 shadow-lg space-y-4">
          <div class="media-ph">Garden media</div>
          <div><h2 id="g-name" class="text-lg font-bold text-white">Kitchen garden</h2><p id="g-sum" class="text-sm text-emerald-300"></p><p id="g-blurb" class="text-xs text-emerald-100/80 mt-2"></p></div>
          <div class="border-t border-emerald-800 pt-3 space-y-3">
            <p class="text-[10px] uppercase tracking-wide text-emerald-400 font-semibold">Live stats</p>
            <div><div class="flex justify-between mb-1"><span class="text-xs text-emerald-100">Season length</span><span id="s-sea-l" class="text-xs text-emerald-400">—</span></div><div class="h-2 bg-emerald-900 rounded-full overflow-hidden"><div id="s-sea" class="stat-fill bg-emerald-400" style="width:50%"></div></div></div>
            <div><div class="flex justify-between mb-1"><span class="text-xs text-emerald-100">Water demand</span><span id="s-wat-l" class="text-xs text-emerald-400">—</span></div><div class="h-2 bg-emerald-900 rounded-full overflow-hidden"><div id="s-wat" class="stat-fill bg-sky-400" style="width:40%"></div></div></div>
            <div><div class="flex justify-between mb-1"><span class="text-xs text-emerald-100">Labor load</span><span id="s-lab-l" class="text-xs text-emerald-400">—</span></div><div class="h-2 bg-emerald-900 rounded-full overflow-hidden"><div id="s-lab" class="stat-fill bg-violet-400" style="width:40%"></div></div></div>
            <div><div class="flex justify-between mb-1"><span class="text-xs text-emerald-100">Soil work</span><span id="s-soil-l" class="text-xs text-emerald-400">—</span></div><div class="h-2 bg-emerald-900 rounded-full overflow-hidden"><div id="s-soil" class="stat-fill bg-amber-400" style="width:45%"></div></div></div>
            <div><div class="flex justify-between mb-1"><span class="text-xs text-emerald-100">Yield density</span><span id="s-yld-l" class="text-xs text-emerald-400">—</span></div><div class="h-2 bg-emerald-900 rounded-full overflow-hidden"><div id="s-yld" class="stat-fill bg-lime-400" style="width:50%"></div></div></div>
            <div><div class="flex justify-between mb-1"><span class="text-xs text-emerald-100">Startup barrier</span><span id="s-bar-l" class="text-xs text-emerald-400">—</span></div><div class="h-2 bg-emerald-900 rounded-full overflow-hidden"><div id="s-bar" class="stat-fill bg-rose-400" style="width:30%"></div></div></div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <footer class="border-t border-stone-200 bg-white py-8"><div class="max-w-6xl mx-auto px-6 flex justify-between text-sm text-stone-500"><a href="/" class="font-medium text-emerald-900">Tractform</a><p>&copy; 2026 Tractform</p></div></footer>
  <script src="/site.js"></script>
  <script>
    const goals={kitchen:{name:'Kitchen garden',blurb:'High-value vegetables near the house.',labor:0.02,water:0.08,soil:50,yld:70,bar:25},calorie:{name:'Calorie crops',blurb:'Space and storage dominate.',labor:0.012,water:0.06,soil:60,yld:55,bar:40},orchard:{name:'Orchard / perennials',blurb:'Multi-year establishment.',labor:0.006,water:0.05,soil:40,yld:45,bar:55},market:{name:'Market garden',blurb:'High labor, high turnover.',labor:0.035,water:0.12,soil:70,yld:85,bar:65}};
    let g='kitchen';function bar(id,pct,label){document.getElementById(id).style.width=Math.min(95,pct)+'%';document.getElementById(id+'-l').textContent=label;}function lbl(p){return p>70?'High':p>40?'Moderate':'Low';}
    function refresh(){const goal=goals[g];const area=+document.getElementById('area').value||100;const waterM=document.getElementById('water').value;const loc=window.TractformLocation?window.TractformLocation.get():{};const zn=loc.zone&&window.TractformLocation?window.TractformLocation.zoneNumber(loc.zone):7;
      document.querySelectorAll('.g-btn').forEach(b=>{const on=b.dataset.g===g;b.classList.toggle('bg-emerald-800',on);b.classList.toggle('text-white',on);b.classList.toggle('border-emerald-800',on);b.classList.toggle('bg-white',!on);b.classList.toggle('text-stone-700',!on);b.classList.toggle('border-stone-300',!on);});
      document.getElementById('g-name').textContent=goal.name;document.getElementById('g-blurb').textContent=goal.blurb;document.getElementById('g-sum').textContent=area.toLocaleString()+' sq ft · '+waterM;
      const seasonPct=Math.min(95,15+zn*7);const days=zn<=4?'~100–140':zn<=6?'~140–180':zn<=8?'~180–230':'~240–320';
      let waterPct=Math.min(95,goal.water*Math.sqrt(area)*(waterM==='overhead'?1.3:waterM==='hand'?1.1:0.9));const laborHrs=goal.labor*area;const laborPct=Math.min(95,laborHrs*2);
      bar('s-sea',seasonPct,lbl(seasonPct));bar('s-wat',waterPct,lbl(waterPct));bar('s-lab',laborPct,lbl(laborPct));bar('s-soil',goal.soil,lbl(goal.soil));bar('s-yld',goal.yld,lbl(goal.yld));bar('s-bar',goal.bar,lbl(goal.bar));
      document.getElementById('t-days').textContent=days;document.getElementById('t-labor').textContent=laborHrs<5?'~'+laborHrs.toFixed(1)+' hr':'~'+Math.round(laborHrs)+' hr';document.getElementById('t-h2o').textContent=waterM==='drip'?'Efficient':waterM==='hand'?'Flexible':'Higher use';}
    document.querySelectorAll('.g-btn').forEach(b=>b.addEventListener('click',()=>{g=b.dataset.g;refresh();}));document.getElementById('area').addEventListener('input',refresh);document.getElementById('water').addEventListener('change',refresh);
    if(window.TractformLocation)window.TractformLocation.onChange(refresh);refresh();
  </script>
</body>
</html>
