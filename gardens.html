<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gardens — Tractform</title>
  <meta name="description" content="Plan kitchen, calorie, orchard, or market gardens — area, labor, season length, and water method estimates by zone." />
  <meta property="og:title" content="Gardens — Tractform" />
  <meta property="og:description" content="Plan kitchen, calorie, orchard, or market gardens — area, labor, season length, and water method estimates by zone." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://tractform.com/gardens.html" />
  <meta name="twitter:card" content="summary" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',system-ui,sans-serif}.media-ph{width:100%;aspect-ratio:16/10;border-radius:.75rem;background:#064e3b;border:1px dashed #065f46;display:flex;align-items:center;justify-content:center;color:#6ee7b7;font-size:.75rem}</style>
</head>
<body class="min-h-screen flex flex-col bg-stone-100 text-stone-900 antialiased">
  <header class="bg-emerald-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between gap-4">
      <a href="/" class="flex items-center gap-2 shrink-0"><div class="w-7 h-7 rounded-md bg-white/15 flex items-center justify-center"><span class="font-bold text-sm">T</span></div><span class="font-semibold tracking-tight">Tractform</span></a>
      <nav class="hidden sm:flex gap-5 text-sm font-medium text-emerald-100/90">
        <a href="/land.html" class="hover:text-white">Land</a>
        <a href="/utilities.html" class="hover:text-white">Utilities</a>
        <a href="/buildings.html" class="hover:text-white">Buildings</a>
        <a href="/production.html" class="hover:text-white">Livestock</a>
        <a href="/gardens.html" class="text-white font-semibold">Gardens</a>
        <a href="/family.html" class="hover:text-white">Household</a>
      </nav>
    </div>
  </header>
  <main class="flex-1">
  <section class="max-w-6xl mx-auto px-6 pt-8 pb-3"><h1 class="text-2xl font-bold tracking-tight">Gardens</h1></section>
  <section class="max-w-6xl mx-auto px-6 pb-16">
    <div class="grid lg:grid-cols-3 gap-6 items-start">
      <div class="lg:col-span-2 space-y-4">
        <div class="bg-white border border-stone-200 rounded-2xl p-5">
          <label class="block text-sm font-semibold mb-3">Focus</label>
          <div class="flex flex-wrap gap-2">
            <button type="button" data-g="kitchen" class="g-btn px-4 py-2 rounded-lg border border-emerald-800 bg-emerald-800 text-white text-sm font-medium">Kitchen garden</button>
            <button type="button" data-g="calorie" class="g-btn px-4 py-2 rounded-lg border border-stone-300 bg-white text-stone-700 text-sm font-medium">Calorie crops</button>
            <button type="button" data-g="orchard" class="g-btn px-4 py-2 rounded-lg border border-stone-300 bg-white text-stone-700 text-sm font-medium">Orchard</button>
            <button type="button" data-g="market" class="g-btn px-4 py-2 rounded-lg border border-stone-300 bg-white text-stone-700 text-sm font-medium">Market garden</button>
          </div>
        </div>
        <div class="bg-white border border-stone-200 rounded-2xl p-5 grid sm:grid-cols-2 gap-4">
          <div><label class="block text-sm font-semibold mb-2">Area (sq ft)</label><input id="area" type="number" min="50" max="200000" value="800" class="w-full rounded-lg border border-stone-300 px-3 py-2.5 text-sm" /></div>
          <div><label class="block text-sm font-semibold mb-2">Water method</label><select id="water" class="w-full rounded-lg border border-stone-300 px-3 py-2.5 text-sm"><option value="hand">Hand / hose</option><option value="drip" selected>Drip</option><option value="overhead">Overhead</option></select></div>
        </div>
      </div>
      <div class="lg:col-span-1">
        <div class="lg:sticky lg:top-20 rounded-2xl bg-emerald-950 text-emerald-50 p-5 shadow-lg space-y-4">
          <div class="media-ph">Garden media</div>
          <div>
            <h2 id="g-name" class="text-lg font-bold text-white">Kitchen garden</h2>
            <p id="g-sum" class="text-sm text-emerald-300"></p>
            <p id="g-blurb" class="text-xs text-emerald-100/80 mt-2"></p>
          </div>
          <div class="border-t border-emerald-800 pt-3 space-y-2.5 text-sm">
            <p class="text-[10px] uppercase tracking-wide text-emerald-400 font-semibold mb-1">Season & load</p>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Area</span><span id="s-area" class="font-medium tabular-nums text-right">—</span></div>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Frost-free days</span><span id="s-days" class="font-medium tabular-nums text-right">—</span></div>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Peak labor</span><span id="s-labor" class="font-medium tabular-nums text-right">—</span></div>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Water method</span><span id="s-h2o" class="font-medium text-right">—</span></div>
            <div class="flex justify-between gap-2 pt-1 border-t border-emerald-800/60"><span class="text-emerald-300/80">Soil work</span><span id="s-soil" class="font-medium text-right">—</span></div>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Startup</span><span id="s-start" class="font-medium text-right">—</span></div>
          </div>
        </div>
      </div>
    </div>
  </section>
  </main>
  <footer class="mt-auto border-t border-stone-200 bg-white py-8">
    <div class="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 text-sm text-stone-500">
      <a href="/" class="font-medium text-emerald-900">Tractform</a>
      <div class="flex flex-wrap items-center gap-x-4 gap-y-1">
        <a href="/disclaimer.html" class="hover:text-emerald-900">Disclaimer</a>
        <a href="/privacy.html" class="hover:text-emerald-900">Privacy</a>
        <span>&copy; 2026 Tractform</span>
      </div>
    </div>
  </footer>
  <script src="/site.js"></script>
  <script>
    const goals = {
      kitchen: { name: 'Kitchen garden', blurb: 'High-value vegetables near the house.', labor: 0.02, soil: 'Moderate beds', bar: 'Low–moderate' },
      calorie: { name: 'Calorie crops', blurb: 'Space and storage dominate.', labor: 0.012, soil: 'More open ground', bar: 'Moderate' },
      orchard: { name: 'Orchard / perennials', blurb: 'Multi-year establishment.', labor: 0.006, soil: 'Site prep once', bar: 'Higher up front' },
      market: { name: 'Market garden', blurb: 'High labor, high turnover.', labor: 0.035, soil: 'Intensive', bar: 'Higher' }
    };
    let g = 'kitchen';
    function refresh() {
      const goal = goals[g];
      const area = +document.getElementById('area').value || 100;
      const waterM = document.getElementById('water').value;
      const loc = window.TractformLocation ? window.TractformLocation.get() : {};
      const zn = loc.zone && window.TractformLocation ? window.TractformLocation.zoneNumber(loc.zone) : 7;
      document.querySelectorAll('.g-btn').forEach(b => {
        const on = b.dataset.g === g;
        b.classList.toggle('bg-emerald-800', on); b.classList.toggle('text-white', on); b.classList.toggle('border-emerald-800', on);
        b.classList.toggle('bg-white', !on); b.classList.toggle('text-stone-700', !on); b.classList.toggle('border-stone-300', !on);
      });
      document.getElementById('g-name').textContent = goal.name;
      document.getElementById('g-blurb').textContent = goal.blurb;
      document.getElementById('g-sum').textContent = area.toLocaleString() + ' sq ft · ' + waterM;
      const days = zn <= 4 ? '~100–140' : zn <= 6 ? '~140–180' : zn <= 8 ? '~180–230' : '~240–320';
      const laborHrs = goal.labor * area;
      document.getElementById('s-area').textContent = area.toLocaleString() + ' sq ft';
      document.getElementById('s-days').textContent = days;
      document.getElementById('s-labor').textContent = laborHrs < 5 ? '~' + laborHrs.toFixed(1) + ' hr/wk' : '~' + Math.round(laborHrs) + ' hr/wk';
      document.getElementById('s-h2o').textContent = waterM === 'drip' ? 'Drip (efficient)' : waterM === 'hand' ? 'Hand / hose' : 'Overhead (higher use)';
      document.getElementById('s-soil').textContent = goal.soil;
      document.getElementById('s-start').textContent = goal.bar;
    }
    document.querySelectorAll('.g-btn').forEach(b => b.addEventListener('click', () => { g = b.dataset.g; refresh(); }));
    document.getElementById('area').addEventListener('input', refresh);
    document.getElementById('water').addEventListener('change', refresh);
    if (window.TractformLocation) window.TractformLocation.onChange(refresh);
    refresh();
  </script>
</body>
</html>
