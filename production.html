<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Livestock — Tractform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Inter',system-ui,sans-serif}
    /* Reserve space at still/video ratio (1500×844 ≈ 16:9) so the card does not jump between loads */
    .video-frame{
      width:100%;
      aspect-ratio:16/9;
      background:#ffffff;
      border-radius:.75rem;
      overflow:hidden;
      border:1px solid rgb(6 78 59 / 0.5);
    }
    .animal-video{
      width:100%;
      height:100%;
      display:block;
      object-fit:contain; /* no crop; 16:9 sources fill 1:1 without soft cover scaling */
      background:#ffffff;
    }
  </style>
</head>
<body class="bg-stone-100 text-stone-900 antialiased">
  <header class="bg-emerald-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between gap-4">
      <a href="/" class="flex items-center gap-2 shrink-0">
        <div class="w-7 h-7 rounded-md bg-white/15 flex items-center justify-center"><span class="text-white font-bold text-sm">T</span></div>
        <span class="font-semibold tracking-tight">Tractform</span>
      </a>
      <nav class="hidden sm:flex gap-5 text-sm font-medium text-emerald-100/90">
        <a href="/land.html" class="hover:text-white">Land</a>
        <a href="/utilities.html" class="hover:text-white">Utilities</a>
        <a href="/buildings.html" class="hover:text-white">Buildings</a>
        <a href="/production.html" class="text-white font-semibold">Livestock</a>
        <a href="/gardens.html" class="hover:text-white">Gardens</a>
        <a href="/family.html" class="hover:text-white">Household</a>
      </nav>
    </div>
  </header>

  <section class="max-w-6xl mx-auto px-6 pt-8 pb-3">
    <h1 class="text-2xl font-bold tracking-tight">Livestock</h1>
  </section>

  <section class="max-w-6xl mx-auto px-6 pb-16">
    <div class="grid lg:grid-cols-3 gap-6 items-start">
      <div class="lg:col-span-2 space-y-4">
        <div class="bg-white border border-stone-200 rounded-2xl p-5">
          <label class="block text-sm font-semibold mb-3">Animal</label>
          <div class="flex flex-wrap gap-2" id="animal-controls">
            <button type="button" data-animal="sheep" class="animal-btn px-4 py-2 rounded-lg border border-emerald-800 bg-emerald-800 text-white text-sm font-medium">Sheep</button>
            <button type="button" data-animal="chickens" class="animal-btn px-4 py-2 rounded-lg border border-stone-300 bg-white text-stone-700 text-sm font-medium">Chickens</button>
            <button type="button" data-animal="goats" class="animal-btn px-4 py-2 rounded-lg border border-stone-300 bg-white text-stone-700 text-sm font-medium">Goats</button>
            <button type="button" data-animal="cattle" class="animal-btn px-4 py-2 rounded-lg border border-stone-300 bg-white text-stone-700 text-sm font-medium">Cattle</button>
            <button type="button" data-animal="pigs" class="animal-btn px-4 py-2 rounded-lg border border-stone-300 bg-white text-stone-700 text-sm font-medium">Pigs</button>
          </div>
        </div>
        <div class="bg-white border border-stone-200 rounded-2xl p-5 grid sm:grid-cols-2 gap-4">
          <div>
            <label for="breed" class="block text-sm font-semibold mb-2">Breed / type</label>
            <select id="breed" class="w-full rounded-lg border border-stone-300 bg-white px-3 py-2.5 text-sm"></select>
            <p id="breed-note" class="text-xs text-stone-500 mt-2"></p>
          </div>
          <div>
            <label for="qty" class="block text-sm font-semibold mb-2">Quantity</label>
            <div class="flex items-center gap-3">
              <input id="qty" type="number" min="1" max="500" value="6" class="w-full rounded-lg border border-stone-300 px-3 py-2.5 text-sm tabular-nums" />
              <span id="qty-unit" class="text-sm text-stone-500">head</span>
            </div>
          </div>
        </div>
      </div>

      <div class="lg:col-span-1">
        <div class="lg:sticky lg:top-20 rounded-2xl bg-emerald-950 text-emerald-50 p-5 shadow-lg space-y-4">
          <div class="video-frame">
            <video id="animal-video" class="animal-video" src="/videos/animals/sheep/Katahdin.mp4" autoplay muted loop playsinline></video>
          </div>
          <div>
            <h2 id="animal-name" class="text-lg font-bold text-white">Sheep</h2>
            <p id="selection-summary" class="text-sm text-emerald-300 font-medium">6 × Katahdin</p>
            <p id="animal-blurb" class="text-xs text-emerald-100/80 mt-2 leading-relaxed"></p>
          </div>
          <div class="border-t border-emerald-800 pt-3 space-y-2.5 text-sm">
            <p class="text-[10px] uppercase tracking-wide text-emerald-400 font-semibold mb-1">For your selection</p>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Land</span><span id="s-land" class="font-medium tabular-nums text-right">—</span></div>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Water / day</span><span id="s-water" class="font-medium tabular-nums text-right">—</span></div>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Chore time</span><span id="s-labor" class="font-medium tabular-nums text-right">—</span></div>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Uses</span><span id="s-uses" class="font-medium text-right">—</span></div>
            <div class="flex justify-between gap-2 pt-1 border-t border-emerald-800/60"><span class="text-emerald-300/80">Shelter</span><span id="s-shelter" class="font-medium text-right">—</span></div>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Feed load</span><span id="s-feed" class="font-medium text-right">—</span></div>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Lifespan / cycle</span><span id="s-life" class="font-medium text-right">—</span></div>
          </div>
          <div class="border-t border-emerald-800 pt-3 space-y-1.5">
            <p class="text-[10px] uppercase tracking-wide text-emerald-400 font-semibold">Zone fit</p>
            <p id="zone-status" class="text-sm font-medium text-emerald-100">Set zone in the header</p>
            <p id="zone-detail" class="text-xs text-emerald-300/70 leading-relaxed"></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="border-t border-stone-200 bg-white py-8">
    <div class="max-w-6xl mx-auto px-6 flex justify-between text-sm text-stone-500">
      <a href="/" class="font-medium text-emerald-900">Tractform</a>
      <p>&copy; 2026 Tractform</p>
    </div>
  </footer>

  <script src="/site.js"></script>
  <script src="/data/livestock.js"></script>
  <script>
    let current = 'sheep';
    const breedSel = document.getElementById('breed');
    const qtyInput = document.getElementById('qty');
    const videoEl = document.getElementById('animal-video');

    function getState() {
      const loc = window.TractformLocation ? window.TractformLocation.get() : {};
      return {
        animal: current,
        breed: breedSel.value,
        quantity: qtyInput.value,
        zone: loc.zone || null,
        place: loc.place || null
      };
    }

    function refreshBreeds() {
      const breeds = window.TractformLivestock.listBreeds(current);
      breedSel.innerHTML = breeds.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
      document.getElementById('qty-unit').textContent = window.TractformLivestock.ANIMALS[current].unit;
    }

    function render(results) {
      if (!results) return;

      document.querySelectorAll('.animal-btn').forEach(b => {
        const on = b.dataset.animal === current;
        b.classList.toggle('bg-emerald-800', on);
        b.classList.toggle('text-white', on);
        b.classList.toggle('border-emerald-800', on);
        b.classList.toggle('bg-white', !on);
        b.classList.toggle('text-stone-700', !on);
        b.classList.toggle('border-stone-300', !on);
      });

      if (videoEl.getAttribute('src') !== results.video) {
        videoEl.src = results.video;
        videoEl.play().catch(() => {});
      }
      document.getElementById('animal-name').textContent = results.animalName;
      document.getElementById('selection-summary').textContent = `${results.quantity} × ${results.breedName}`;
      document.getElementById('animal-blurb').textContent = results.blurb;
      document.getElementById('breed-note').textContent = results.breedNote;

      document.getElementById('s-land').textContent = results.landLabel;
      document.getElementById('s-water').textContent = results.waterLabel;
      document.getElementById('s-labor').textContent = results.laborLabel;
      document.getElementById('s-uses').textContent = results.uses;

      const b = results.bars || {};
      document.getElementById('s-shelter').textContent = (b.shelter && b.shelter.label) || '—';
      document.getElementById('s-feed').textContent = (b.feed && b.feed.label) || '—';
      document.getElementById('s-life').textContent = (b.life && b.life.label) || '—';

      const st = document.getElementById('zone-status');
      const det = document.getElementById('zone-detail');
      const zf = results.zoneFit;
      st.textContent = zf.label;
      det.textContent = zf.detail;
      if (zf.status === 'good') st.className = 'text-sm font-medium text-emerald-300';
      else if (zf.status === 'colder' || zf.status === 'warmer') st.className = 'text-sm font-medium text-amber-300';
      else st.className = 'text-sm font-medium text-emerald-100';
    }

    function refreshAll() {
      render(window.TractformLivestock.calculate(getState()));
    }

    document.querySelectorAll('.animal-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        current = btn.dataset.animal;
        refreshBreeds();
        refreshAll();
      });
    });
    breedSel.addEventListener('change', refreshAll);
    qtyInput.addEventListener('input', refreshAll);
    if (window.TractformLocation) window.TractformLocation.onChange(() => refreshAll());

    refreshBreeds();
    refreshAll();
  </script>
</body>
</html>
