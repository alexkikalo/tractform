<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utilities — Tractform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',system-ui,sans-serif}.media-ph{width:100%;aspect-ratio:16/10;border-radius:.75rem;background:#064e3b;border:1px dashed #065f46;display:flex;align-items:center;justify-content:center;color:#6ee7b7;font-size:.75rem;text-align:center}</style>
</head>
<body class="min-h-screen flex flex-col bg-stone-100 text-stone-900 antialiased">
  <header class="bg-emerald-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between gap-4">
      <a href="/" class="flex items-center gap-2 shrink-0"><div class="w-7 h-7 rounded-md bg-white/15 flex items-center justify-center"><span class="font-bold text-sm">T</span></div><span class="font-semibold tracking-tight">Tractform</span></a>
      <nav class="hidden sm:flex gap-5 text-sm font-medium text-emerald-100/90">
        <a href="/land.html" class="hover:text-white">Land</a>
        <a href="/utilities.html" class="text-white font-semibold">Utilities</a>
        <a href="/buildings.html" class="hover:text-white">Buildings</a>
        <a href="/production.html" class="hover:text-white">Livestock</a>
        <a href="/gardens.html" class="hover:text-white">Gardens</a>
        <a href="/family.html" class="hover:text-white">Household</a>
      </nav>
    </div>
  </header>

  <main class="flex-1">
  <section class="max-w-6xl mx-auto px-6 pt-8 pb-3"><h1 class="text-2xl font-bold tracking-tight">Utilities</h1></section>
  <section class="max-w-6xl mx-auto px-6 pb-16">
    <div class="grid lg:grid-cols-3 gap-6 items-start">
      <div class="lg:col-span-2 space-y-4">
        <div class="bg-white border border-stone-200 rounded-2xl p-5">
          <label class="block text-sm font-semibold mb-3">Focus</label>
          <div class="flex flex-wrap gap-2">
            <button type="button" data-focus="water" class="f-btn px-4 py-2 rounded-lg border border-emerald-800 bg-emerald-800 text-white text-sm font-medium">Water / well</button>
            <button type="button" data-focus="power" class="f-btn px-4 py-2 rounded-lg border border-stone-300 bg-white text-stone-700 text-sm font-medium">Power / solar</button>
            <button type="button" data-focus="septic" class="f-btn px-4 py-2 rounded-lg border border-stone-300 bg-white text-stone-700 text-sm font-medium">Septic</button>
          </div>
        </div>
        <div class="bg-white border border-stone-200 rounded-2xl p-5 grid sm:grid-cols-3 gap-4">
          <div><label class="block text-sm font-semibold mb-2">People on site</label><input id="people" type="number" min="1" max="20" value="4" class="w-full rounded-lg border border-stone-300 px-3 py-2.5 text-sm" /></div>
          <div><label class="block text-sm font-semibold mb-2">Livestock water</label><select id="livestock" class="w-full rounded-lg border border-stone-300 px-3 py-2.5 text-sm"><option value="none">None</option><option value="small" selected>Small stock</option><option value="cattle">Cattle-scale</option></select></div>
          <div><label class="block text-sm font-semibold mb-2">Irrigation</label><select id="irrig" class="w-full rounded-lg border border-stone-300 px-3 py-2.5 text-sm"><option value="none">None</option><option value="garden" selected>Garden only</option><option value="field">Field / orchard</option></select></div>
        </div>
      </div>
      <div class="lg:col-span-1">
        <div class="lg:sticky lg:top-20 rounded-2xl bg-emerald-950 text-emerald-50 p-5 shadow-lg space-y-4">
          <div class="media-ph">Utilities media</div>
          <div>
            <h2 id="focus-name" class="text-lg font-bold text-white">Water / well</h2>
            <p id="focus-blurb" class="text-xs text-emerald-100/80 mt-2 leading-relaxed"></p>
          </div>
          <div class="border-t border-emerald-800 pt-3 space-y-2.5 text-sm">
            <p class="text-[10px] uppercase tracking-wide text-emerald-400 font-semibold mb-1">Estimates</p>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Peak water / day</span><span id="s-water" class="font-medium tabular-nums text-right">—</span></div>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Typical well depth</span><span id="s-well" class="font-medium tabular-nums text-right">—</span></div>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Solar yield</span><span id="s-solar" class="font-medium tabular-nums text-right">—</span></div>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Grid</span><span id="s-grid" class="font-medium text-right">—</span></div>
            <div class="flex justify-between gap-2 pt-1 border-t border-emerald-800/60"><span class="text-emerald-300/80">Septic scale</span><span id="s-septic" class="font-medium text-right">—</span></div>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Storage cue</span><span id="s-stor" class="font-medium text-right">—</span></div>
          </div>
        </div>
      </div>
    </div>
  </section>
  </main>

  <footer class="mt-auto border-t border-stone-200 bg-white py-8">
    <div class="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 text-sm text-stone-500">
      <a href="/" class="font-medium text-emerald-900">Tractform</a>
      <div class="flex flex-wrap items-center gap-x-4 gap-y-1">
        <a href="/disclaimer.html" class="hover:text-emerald-900">Disclaimer</a>
        <a href="/privacy.html" class="hover:text-emerald-900">Privacy</a>
        <span>&copy; 2026 Tractform</span>
      </div>
    </div>
  </footer>
  <script src="/site.js"></script>
  <script>
    let focus = 'water';
    const blurbs = { water: 'Source, yield, storage, and distribution matched to peak demand.', power: 'Grid, solar, and generator sized to pumps, tools, and cold-chain loads.', septic: 'Soil and occupancy drive system type more than preference.' };
    function refresh() {
      const people = +document.getElementById('people').value || 1;
      const live = document.getElementById('livestock').value;
      const irrig = document.getElementById('irrig').value;
      const loc = window.TractformLocation ? window.TractformLocation.get() : {};
      const zn = loc.zone && window.TractformLocation ? window.TractformLocation.zoneNumber(loc.zone) : 7;
      document.querySelectorAll('.f-btn').forEach(b => {
        const on = b.dataset.focus === focus;
        b.classList.toggle('bg-emerald-800', on); b.classList.toggle('text-white', on); b.classList.toggle('border-emerald-800', on);
        b.classList.toggle('bg-white', !on); b.classList.toggle('text-stone-700', !on); b.classList.toggle('border-stone-300', !on);
      });
      document.getElementById('focus-name').textContent = focus === 'water' ? 'Water / well' : focus === 'power' ? 'Power / solar' : 'Septic';
      document.getElementById('focus-blurb').textContent = blurbs[focus];
      let gal = people * 75;
      if (live === 'small') gal += 40;
      if (live === 'cattle') gal += 200;
      if (irrig === 'garden') gal += 50;
      if (irrig === 'field') gal += 300;
      const wellFt = zn <= 4 ? '80–200 ft' : zn <= 7 ? '100–300 ft' : zn <= 9 ? '150–400 ft' : '200–500+ ft';
      const solarKwh = zn <= 4 ? '~3.0–3.8 kWh/kW' : zn <= 6 ? '~3.8–4.6 kWh/kW' : zn <= 8 ? '~4.5–5.4 kWh/kW' : '~5.0–6.2 kWh/kW';
      const septic = people <= 3 ? 'Standard residential' : people <= 6 ? 'Standard / maybe larger tank' : 'Engineered / higher capacity';
      const stor = gal < 200 ? '1–2 day buffer' : gal < 400 ? '2–3 day buffer' : '3+ day or larger cistern';
      document.getElementById('s-water').textContent = '~' + Math.round(gal) + ' gal';
      document.getElementById('s-well').textContent = wellFt;
      document.getElementById('s-solar').textContent = solarKwh;
      document.getElementById('s-grid').textContent = 'Check local utility';
      document.getElementById('s-septic').textContent = septic;
      document.getElementById('s-stor').textContent = stor;
    }
    document.querySelectorAll('.f-btn').forEach(b => b.addEventListener('click', () => { focus = b.dataset.focus; refresh(); }));
    ['people','livestock','irrig'].forEach(id => { document.getElementById(id).addEventListener('input', refresh); document.getElementById(id).addEventListener('change', refresh); });
    if (window.TractformLocation) window.TractformLocation.onChange(refresh);
    refresh();
  </script>
</body>
</html>
