<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buildings — Tractform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',system-ui,sans-serif}.media-ph{width:100%;aspect-ratio:16/10;border-radius:.75rem;background:#064e3b;border:1px dashed #065f46;display:flex;align-items:center;justify-content:center;color:#6ee7b7;font-size:.75rem}</style>
</head>
<body class="min-h-screen flex flex-col bg-stone-100 text-stone-900 antialiased">
  <header class="bg-emerald-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between gap-4">
      <a href="/" class="flex items-center gap-2 shrink-0"><div class="w-7 h-7 rounded-md bg-white/15 flex items-center justify-center"><span class="font-bold text-sm">T</span></div><span class="font-semibold tracking-tight">Tractform</span></a>
      <nav class="hidden sm:flex gap-5 text-sm font-medium text-emerald-100/90">
        <a href="/land.html" class="hover:text-white">Land</a>
        <a href="/utilities.html" class="hover:text-white">Utilities</a>
        <a href="/buildings.html" class="text-white font-semibold">Buildings</a>
        <a href="/production.html" class="hover:text-white">Livestock</a>
        <a href="/gardens.html" class="hover:text-white">Gardens</a>
        <a href="/family.html" class="hover:text-white">Household</a>
      </nav>
    </div>
  </header>
  <main class="flex-1">
  <section class="max-w-6xl mx-auto px-6 pt-8 pb-3"><h1 class="text-2xl font-bold tracking-tight">Buildings</h1></section>
  <section class="max-w-6xl mx-auto px-6 pb-16">
    <div class="grid lg:grid-cols-3 gap-6 items-start">
      <div class="lg:col-span-2 space-y-4">
        <div class="bg-white border border-stone-200 rounded-2xl p-5">
          <label class="block text-sm font-semibold mb-3">Structure</label>
          <div class="flex flex-wrap gap-2">
            <button type="button" data-type="house" class="t-btn px-4 py-2 rounded-lg border border-emerald-800 bg-emerald-800 text-white text-sm font-medium">House / cabin</button>
            <button type="button" data-type="barn" class="t-btn px-4 py-2 rounded-lg border border-stone-300 bg-white text-stone-700 text-sm font-medium">Barn / shop</button>
            <button type="button" data-type="coop" class="t-btn px-4 py-2 rounded-lg border border-stone-300 bg-white text-stone-700 text-sm font-medium">Chicken coop</button>
            <button type="button" data-type="shed" class="t-btn px-4 py-2 rounded-lg border border-stone-300 bg-white text-stone-700 text-sm font-medium">Shed / lean-to</button>
          </div>
        </div>
        <div class="bg-white border border-stone-200 rounded-2xl p-5 grid sm:grid-cols-2 gap-4">
          <div><label class="block text-sm font-semibold mb-2">Style</label><select id="style" class="w-full rounded-lg border border-stone-300 px-3 py-2.5 text-sm"></select><p id="style-note" class="text-xs text-stone-500 mt-2"></p></div>
          <div><label class="block text-sm font-semibold mb-2">Footprint (sq ft)</label><input id="sqft" type="number" min="40" max="10000" value="1200" class="w-full rounded-lg border border-stone-300 px-3 py-2.5 text-sm" /></div>
        </div>
      </div>
      <div class="lg:col-span-1">
        <div class="lg:sticky lg:top-20 rounded-2xl bg-emerald-950 text-emerald-50 p-5 shadow-lg space-y-4">
          <div class="media-ph">Building media</div>
          <div>
            <h2 id="type-name" class="text-lg font-bold text-white">House / cabin</h2>
            <p id="sel-sum" class="text-sm text-emerald-300"></p>
            <p id="type-blurb" class="text-xs text-emerald-100/80 mt-2"></p>
          </div>
          <div class="border-t border-emerald-800 pt-3 space-y-2.5 text-sm">
            <p class="text-[10px] uppercase tracking-wide text-emerald-400 font-semibold mb-1">Code & climate</p>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Footprint</span><span id="s-sqft" class="font-medium tabular-nums text-right">—</span></div>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Frost depth</span><span id="s-frost" class="font-medium tabular-nums text-right">—</span></div>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Foundation</span><span id="s-found" class="font-medium text-right">—</span></div>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Wind / snow</span><span id="s-wind" class="font-medium text-right">—</span></div>
            <div class="flex justify-between gap-2 pt-1 border-t border-emerald-800/60"><span class="text-emerald-300/80">Code path</span><span id="s-code" class="font-medium text-right">—</span></div>
            <div class="flex justify-between gap-2"><span class="text-emerald-300/80">Speed to usable</span><span id="s-speed" class="font-medium text-right">—</span></div>
          </div>
        </div>
      </div>
    </div>
  </section>
  </main>
  <footer class="mt-auto border-t border-stone-200 bg-white py-8">
    <div class="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 text-sm text-stone-500">
      <a href="/" class="font-medium text-emerald-900">Tractform</a>
      <div class="flex flex-wrap items-center gap-x-4 gap-y-1">
        <a href="/disclaimer.html" class="hover:text-emerald-900">Disclaimer</a>
        <a href="/privacy.html" class="hover:text-emerald-900">Privacy</a>
        <span>&copy; 2026 Tractform</span>
      </div>
    </div>
  </footer>
  <script src="/site.js"></script>
  <script>
    const types = {
      house: { name: 'House / cabin', blurb: 'Living space — foundation, envelope, and code path dominate.', styles: [
        { id: 'stick', name: 'Stick-frame', note: 'Standard residential.', f: 70, c: 80, s: 35 },
        { id: 'cabin', name: 'Simple cabin', note: 'Smaller envelope.', f: 55, c: 55, s: 55 },
        { id: 'barndominium', name: 'Barndominium', note: 'Metal shell + fit-out.', f: 60, c: 65, s: 50 }
      ], defaultSq: 1200 },
      barn: { name: 'Barn / shop', blurb: 'Clear span and door height follow equipment and stock.', styles: [
        { id: 'pole', name: 'Pole barn', note: 'Fast clear span.', f: 40, c: 35, s: 75 },
        { id: 'rigid', name: 'Rigid-frame metal', note: 'Engineered spans.', f: 50, c: 45, s: 65 },
        { id: 'postbeam', name: 'Post-and-beam', note: 'Heavier timber labor.', f: 55, c: 40, s: 40 }
      ], defaultSq: 2000 },
      coop: { name: 'Chicken coop', blurb: 'Predator-proof, dry, ventilated.', styles: [
        { id: 'static', name: 'Fixed coop + run', note: 'Permanent or skids.', f: 25, c: 15, s: 80 },
        { id: 'tractor', name: 'Chicken tractor', note: 'Mobile, small flock.', f: 10, c: 10, s: 90 },
        { id: 'tractor-barn', name: 'Mini barn coop', note: 'Walk-in.', f: 30, c: 20, s: 70 }
      ], defaultSq: 80 },
      shed: { name: 'Shed / lean-to', blurb: 'Tool and feed storage — speed and dry ground.', styles: [
        { id: 'skid', name: 'Skid shed', note: 'Movable.', f: 15, c: 15, s: 90 },
        { id: 'leanto', name: 'Lean-to', note: 'Open side.', f: 20, c: 15, s: 85 },
        { id: 'slab', name: 'Slab shed', note: 'Permanent floor.', f: 40, c: 25, s: 60 }
      ], defaultSq: 200 }
    };
    let cur = 'house';
    const styleSel = document.getElementById('style');
    const sqft = document.getElementById('sqft');
    function fillStyles() {
      const t = types[cur];
      styleSel.innerHTML = t.styles.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
      sqft.value = t.defaultSq;
    }
    function refresh() {
      const t = types[cur];
      const st = t.styles.find(s => s.id === styleSel.value) || t.styles[0];
      const loc = window.TractformLocation ? window.TractformLocation.get() : {};
      const zn = loc.zone && window.TractformLocation ? window.TractformLocation.zoneNumber(loc.zone) : 7;
      document.querySelectorAll('.t-btn').forEach(b => {
        const on = b.dataset.type === cur;
        b.classList.toggle('bg-emerald-800', on); b.classList.toggle('text-white', on); b.classList.toggle('border-emerald-800', on);
        b.classList.toggle('bg-white', !on); b.classList.toggle('text-stone-700', !on); b.classList.toggle('border-stone-300', !on);
      });
      document.getElementById('type-name').textContent = t.name;
      document.getElementById('type-blurb').textContent = t.blurb;
      document.getElementById('style-note').textContent = st.note;
      document.getElementById('sel-sum').textContent = st.name + ' · ' + Number(sqft.value).toLocaleString() + ' sq ft';
      document.getElementById('s-sqft').textContent = Number(sqft.value).toLocaleString() + ' sq ft';
      document.getElementById('s-frost').textContent = zn <= 4 ? '48–60"+' : zn <= 6 ? '36–48"' : zn <= 8 ? '12–24"' : '0–12"';
      document.getElementById('s-found').textContent = st.f > 55 ? 'Engineered / frost' : st.f > 30 ? 'Pier / edge' : 'Skids / light';
      document.getElementById('s-wind').textContent = zn <= 5 ? 'Snow + wind' : zn >= 9 ? 'Wind / heat' : 'Moderate';
      document.getElementById('s-code').textContent = st.c > 60 ? 'Permit-heavy' : st.c > 30 ? 'Local review' : 'Usually light';
      document.getElementById('s-speed').textContent = st.s > 70 ? 'Days–weeks' : st.s > 45 ? 'Weeks–months' : 'Months+';
    }
    document.querySelectorAll('.t-btn').forEach(b => b.addEventListener('click', () => { cur = b.dataset.type; fillStyles(); refresh(); }));
    styleSel.addEventListener('change', refresh);
    sqft.addEventListener('input', refresh);
    if (window.TractformLocation) window.TractformLocation.onChange(refresh);
    fillStyles(); refresh();
  </script>
</body>
</html>
